<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor de Passagens</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mut:#64707f;--line:#dfe3e8;--acc:#0b6bcb;--ok:#13795b;--err:#b3261e}
  @media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b222b;--ink:#e7ebf0;--mut:#93a0b0;--line:#2c3643;--acc:#4ea1ff;--ok:#4cc9a0;--err:#ff8a80}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
  h1{font-size:20px;margin:6px 0 2px}
  .sub{color:var(--mut);font-size:14px;margin:0 0 14px}
  section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label{display:block;font-size:13px;color:var(--mut)}
  input,select{width:100%;margin-top:4px;padding:10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
  .full{grid-column:1/-1}
  .preview{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px;margin-top:10px;word-break:break-all}
  .hint{font-size:13px;color:var(--mut);margin-top:6px}
  .btns{display:grid;gap:8px}
  button{font:inherit;padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  button:disabled{opacity:.55}
  #status{font-size:14px;margin-top:10px;white-space:pre-wrap}
  .ok{color:var(--ok)}.err{color:var(--err)}
</style>
</head>
<body>
<main>
  <h1>✈️ Monitor de Passagens</h1>
  <p class="sub">Defina rota, datas, meta e horários da busca. Os resultados chegam por e-mail.</p>

  <section>
    <h2>Rota e datas</h2>
    <div class="grid">
      <label>Origem (aeroporto)<input id="orig" value="FLN" maxlength="30" autocapitalize="characters"></label>
      <label>Destino (aeroporto)<input id="dest" value="MIA" maxlength="30" autocapitalize="characters"></label>
      <label>Ida<input id="ida" type="date" value="2027-02-14"></label>
      <label>Volta<input id="volta" type="date" value="2027-02-24"></label>
      <label>Adultos<input id="pax" type="number" min="1" max="9" value="4"></label>
      <label>Espera máx. na escala (h)<input id="wait" type="number" min="1" max="24" value="6"></label>
      <label>Meta por pessoa (R$)<input id="meta" type="number" min="0" step="50" value="8000"></label>
      <label>E-mail dos avisos<input id="mail" type="email" value="jorge.stefani@gmail.com"></label>
    </div>
  </section>

  <section>
    <h2>Programação</h2>
    <div class="grid">
      <label class="full">Repetir a cada
        <select id="step">
          <option value="1">1 hora</option>
          <option value="2" selected>2 horas</option>
          <option value="3">3 horas</option>
          <option value="4">4 horas</option>
          <option value="6">6 horas</option>
          <option value="8">8 horas</option>
          <option value="12">12 horas</option>
          <option value="24">1 vez por dia</option>
        </select>
      </label>
      <label>A partir das (h)<input id="h1" type="number" min="0" max="23" value="0"></label>
      <label>Até às (h)<input id="h2" type="number" min="0" max="23" value="23"></label>
      <label class="full">Minuto da hora<input id="min" type="number" min="0" max="59" value="7"></label>
    </div>
    <div class="preview" id="cron"></div>
    <div class="hint" id="human"></div>
    <div class="hint">Horário de Brasília. O sistema aceita no mínimo 1 hora entre buscas.</div>
  </section>

  <section>
    <div class="btns">
      <button class="primary" id="save">Salvar programação</button>
      <button id="run">Buscar agora</button>
      <button id="copy">Copiar pedido para colar no Claude</button>
    </div>
    <div id="status"></div>
  </section>
</main>

<script>
const SERVER = "Claude Code Remote";
const TRIGGER_ID = "trig_01VXzHUMz9KENu7ZH7tY8xwn";
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const brDate = s => s ? s.split("-").reverse().join("/") : "";
const brl = n => Number(n).toLocaleString("pt-BR", {minimumFractionDigits: 2});

function cron(){
  const step = +$("step").value, h1 = +$("h1").value, h2 = +$("h2").value, m = +$("min").value;
  let hours;
  if (step === 24) hours = String(h1);
  else if (h1 === 0 && h2 === 23) hours = "*/" + step;
  else hours = h1 + "-" + h2 + "/" + step;
  return "CRON_TZ=America/Sao_Paulo " + m + " " + hours + " * * *";
}
function human(){
  const step = +$("step").value, h1 = +$("h1").value, h2 = +$("h2").value, m = +$("min").value;
  if (step === 24) return "Todo dia às " + pad(h1) + ":" + pad(m);
  const hrs = [];
  for (let h = h1; h <= h2 && hrs.length < 48; h += step) hrs.push(pad(h) + ":" + pad(m));
  return "Roda às " + hrs.join(", ");
}
function prompt_(){
  const o = $("orig").value.trim().toUpperCase(), d = $("dest").value.trim().toUpperCase();
  const ida = brDate($("ida").value), volta = brDate($("volta").value);
  const pax = $("pax").value, wait = $("wait").value, meta = brl($("meta").value), mail = $("mail").value.trim();
  return `Monitore passagens aéreas de ida e volta ${o} → ${d}, saída ${ida} e volta ${volta}, ${pax} adultos, em reais (BRL). Pesquise na web (Google Flights, Decolar, Skyscanner, Kayak, companhias aéreas, etc.). Regra obrigatória: nenhuma espera/conexão (layover) pode passar de ${wait} horas, em nenhum trecho; descarte opções com escala mais longa. Meta do Jorge: R$ ${meta} por pessoa (ida e volta) ou menos.

A CADA execução, envie UM e-mail (Gmail) para ${mail} com o resultado da busca: as 5 melhores opções (no mínimo 5, se existirem) que cumprem a regra das escalas, preferindo horários de voo variados (manhã, tarde, noite, madrugada) e companhias variadas. Para cada opção: companhia, horários de ida e volta, escalas e duração de cada espera, preço por pessoa e total dos ${pax}, e link. Ordene do mais barato ao mais caro. Assunto: 'Passagens ${o}-${d} – menor R$ X por pessoa' (data/hora da busca no corpo). Se alguma opção estiver em R$ ${meta} por pessoa ou menos, comece o assunto com 'URGENTE – NA META:' e destaque essa opção no topo do e-mail. Se houver menos de 5 opções válidas, envie as que achou e diga isso. Envie SOMENTE por e-mail; não envie push, nem WhatsApp. Nunca compre nada; apenas informe. Escreva em português.`;
}
function refresh(){ $("cron").textContent = cron(); $("human").textContent = human(); }
document.querySelectorAll("input,select").forEach(e => e.addEventListener("input", refresh));
refresh();
if (typeof claude === "undefined") {
  $("save").disabled = true; $("run").disabled = true;
  $("status").textContent = "Fora do Claude, só o botão “Copiar pedido” funciona: copie e cole no chat do Claude para aplicar.";
}

function validate(){
  const o = $("orig").value.trim(), d = $("dest").value.trim();
  if (!o || !d) return "Preencha origem e destino.";
  if (!$("ida").value || !$("volta").value) return "Preencha as datas de ida e volta.";
  if ($("volta").value <= $("ida").value) return "A volta precisa ser depois da ida.";
  if (!/^\S+@\S+\.\S+$/.test($("mail").value.trim())) return "E-mail inválido.";
  if (+$("h1").value > +$("h2").value) return "O horário inicial precisa ser menor ou igual ao final.";
  const m = +$("min").value; if (!(m >= 0 && m <= 59)) return "Minuto entre 0 e 59.";
  return "";
}
function say(msg, cls){ const s = $("status"); s.textContent = msg; s.className = cls || ""; }

const ERR = {
  not_in_manifest: "Esta página não tem permissão para essa ação. Autorize quando o Claude pedir, ou use o botão de copiar pedido.",
  approval_required: "É preciso aprovar a ação quando o Claude perguntar. Toque de novo e permita.",
  server_not_connected: "O conector de tarefas agendadas não está disponível aqui. Use o botão “Copiar pedido” e cole no Claude.",
  needs_reauth: "Reconecte o conector em claude.ai → Configurações → Conectores, ou use “Copiar pedido”.",
  tool_error: "O serviço recusou a alteração. Use “Copiar pedido” e cole no Claude.",
  blocked_by_policy: "Sua organização bloqueou essa ação. Use “Copiar pedido” e cole no Claude.",
};
function explain(e){ return (ERR[e && e.code] || "Não consegui concluir (" + (e && e.code || "erro") + "). Use “Copiar pedido” e cole no Claude."); }

async function server(){
  if (typeof claude === "undefined") throw {code: "server_not_connected"};
  const mcp = await claude.use("mcp");
  if (!mcp) throw {code: "server_not_connected"};
  return mcp.server(SERVER);
}

$("save").onclick = async () => {
  const bad = validate(); if (bad) return say(bad, "err");
  $("save").disabled = true; say("Salvando…");
  try {
    const s = await server();
    await s.update_trigger({trigger_id: TRIGGER_ID, cron_expression: cron(), prompt: prompt_()});
    say("Programação salva. " + human() + ".", "ok");
  } catch (e) { say(explain(e), "err"); }
  $("save").disabled = false;
};

$("run").onclick = async () => {
  $("run").disabled = true; say("Disparando busca…");
  try {
    const s = await server();
    await s.fire_trigger({trigger_id: TRIGGER_ID});
    say("Busca disparada. O resultado chega por e-mail em alguns minutos.", "ok");
  } catch (e) { say(explain(e), "err"); }
  $("run").disabled = false;
};

$("copy").onclick = async () => {
  const bad = validate(); if (bad) return say(bad, "err");
  const txt = "Atualize o monitor de passagens (tarefa agendada " + TRIGGER_ID + ") com estes dados.\nProgramação (cron): " + cron() + "\n(" + human() + ")\n\nPrompt:\n" + prompt_();
  try { await navigator.clipboard.writeText(txt); say("Pedido copiado. Cole no chat do Claude.", "ok"); }
  catch (e) { say("Não consegui copiar automaticamente. Copie o texto abaixo:\n\n" + txt, "err"); }
};
</script>
</body>
</html>
