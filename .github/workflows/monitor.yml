name: Monitor de passagens
on:
  schedule:
    - cron: "7 * * * *"      # toda hora; o script respeita monitor/config.json
  workflow_dispatch:
  push:
    paths: ["monitor/buscar.py", "monitor/diag.py", ".github/workflows/monitor.yml"]
permissions:
  contents: write
concurrency: monitor
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install fast-flights typing_extensions
      - run: python monitor/buscar.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      - run: python monitor/diag.py || true
      - name: Salvar resultado
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add monitor/resultado.json monitor/diag.json
          git diff --cached --quiet || (git commit -m "Resultado da busca" && git pull --rebase -q && git push)
